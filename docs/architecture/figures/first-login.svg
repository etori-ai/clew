<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <title>The first login: the identity provider vouches for the account, and Clew binds that subject to the one provisioned person with the same user name</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <!-- Person -->
  <rect x="30" y="60" width="170" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="115" y="92" text-anchor="middle" font-weight="600" fill="#111827">Hillevi</text>
  <text x="115" y="114" text-anchor="middle" fill="#374151">opens Clew</text>
  <!-- IdP -->
  <rect x="250" y="60" width="200" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="350" y="86" text-anchor="middle" font-weight="600" fill="#111827">The municipality's SSO</text>
  <text x="350" y="108" text-anchor="middle" fill="#374151">OIDC: Keycloak, Entra, …</text>
  <text x="350" y="128" text-anchor="middle" font-size="12" fill="#6b7280">vouches for sub and preferred_username</text>
  <line x1="200" y1="100" x2="248" y2="100" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Clew decision -->
  <rect x="500" y="40" width="470" height="120" rx="10" fill="#eef4ff" stroke="#1d4ed8"/>
  <text x="735" y="68" text-anchor="middle" font-weight="600" fill="#1e3a8a">Clew: is this subject already bound to a person?</text>
  <text x="735" y="92" text-anchor="middle" fill="#374151">yes → that person, as every later login</text>
  <text x="735" y="114" text-anchor="middle" fill="#374151">no → the one enabled, provisioned person whose userName</text>
  <text x="735" y="134" text-anchor="middle" fill="#374151">equals the claim OIDC_BINDING_CLAIM (default preferred_username)</text>
  <line x1="450" y1="100" x2="498" y2="100" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Outcomes -->
  <line x1="640" y1="160" x2="640" y2="208" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="210" width="280" height="100" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="640" y="238" text-anchor="middle" font-weight="600" fill="#065f46">Exactly one match</text>
  <text x="640" y="260" text-anchor="middle" fill="#374151">the binding is written once</text>
  <text x="640" y="280" text-anchor="middle" fill="#374151">audit: identity-bound · a session starts</text>
  <text x="640" y="300" text-anchor="middle" fill="#6b7280">access = the person's derived grant</text>
  <line x1="880" y1="160" x2="880" y2="208" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="210" width="180" height="100" rx="10" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="890" y="238" text-anchor="middle" font-weight="600" fill="#991b1b">Denied</text>
  <text x="890" y="260" text-anchor="middle" fill="#374151">no match · two matches</text>
  <text x="890" y="280" text-anchor="middle" fill="#374151">disabled · subject changed</text>
  <text x="890" y="300" text-anchor="middle" fill="#6b7280">audited, never a new user</text>
  <!-- Notes -->
  <rect x="30" y="340" width="940" height="70" rx="10" fill="#ffffff" stroke="#c7d7f5" stroke-dasharray="4 3"/>
  <text x="500" y="366" text-anchor="middle" fill="#374151">The provisioner decided who exists and what they may do, before anyone signed in. SSO decides who is at the keyboard.</text>
  <text x="500" y="390" text-anchor="middle" fill="#6b7280">An e-mail address is never the match. A changed subject for a bound person needs a human's review; Clew does not rebind by itself.</text>
</svg>
