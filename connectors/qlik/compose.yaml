# The Qlik connector on its own, next to a Clew and a Qlik it can reach. An administrator registers it in Clew
# (Administration › Anslutna system, or `bun scripts/connector-add.ts`), so nothing on Clew's container names it (D23).
# In development it is the `qlik` service of .devcontainer/compose.yaml instead (README.md).
#
#   QLIK_SECRET=<16+ characters> CLEW_URL=https://clew.example QLIK_ADAPTER=engine QLIK_URL=wss://… QLIK_APP_ID=… \
#   QLIK_TOKEN=… QLIK_SICK_LEAVE_CUBE='{"unit":"…","period":"…","measures":{"total":"…","headcount":"…"}}' \
#   QLIK_UNIT_MAP='{"<unit id>":["…"]}' docker compose -f connectors/qlik/compose.yaml up qlik
#
# The secret and the token come from the secrets store, never from this file.
# QLIK_ADAPTER has no default: the connector does not start without it. `QLIK_ADAPTER=fixture` serves the made-up
# statistics in statistics.mjs instead, for development only, and is refused beside QLIK_URL, QLIK_APP_ID or QLIK_TOKEN
# (D82).
services:
  qlik:
    build: .
    environment:
      CLEW_CONNECTOR_SECRET: ${QLIK_SECRET:?set QLIK_SECRET to a shared secret of 16+ characters}
      CLEW_URL: ${CLEW_URL:?set CLEW_URL to Clew's base URL, https outside local development}
      QLIK_ADAPTER: ${QLIK_ADAPTER:?set QLIK_ADAPTER to engine (with QLIK_URL, QLIK_APP_ID and QLIK_TOKEN), or to fixture for made-up development data}
      QLIK_UNIT_MAP: ${QLIK_UNIT_MAP:-}
      QLIK_MIN_GROUP: ${QLIK_MIN_GROUP:-}
      QLIK_SICK_LEAVE_WARN_ABOVE: ${QLIK_SICK_LEAVE_WARN_ABOVE:-}
      QLIK_CACHE_SECONDS: ${QLIK_CACHE_SECONDS:-}
      QLIK_URL: ${QLIK_URL:-}
      QLIK_APP_ID: ${QLIK_APP_ID:-}
      QLIK_TOKEN: ${QLIK_TOKEN:-}
      QLIK_SICK_LEAVE_CUBE: ${QLIK_SICK_LEAVE_CUBE:-}
      QLIK_RATES_AS: ${QLIK_RATES_AS:-}
    ports:
      - "127.0.0.1:4048:4048"
