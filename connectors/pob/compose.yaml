# The POB connector on its own, next to a Clew and a POB it can reach. An administrator registers it in Clew
# (Administration › Anslutna system, or `bun scripts/connector-add.ts`), so nothing on Clew's container names it (D23).
# In development it runs inside the app container instead (README.md, "Run and check").
#
#   POB_SECRET=<16+ characters> CLEW_URL=https://clew.example POB_ADAPTER=api \
#   POB_IDP_ISSUER=<the identity provider's issuer> POB_IDP_JWKS_URL=<where its keys are> \
#   docker compose -f connectors/pob/compose.yaml up pob
#
# CLEW_URL is https: the connector fetches Clew's public keys from it, and over plain http only from a host of the
# development stack. POB_ADAPTER has no default: the connector does not start without it. `api` (a draft adapter that
# has met no POB, README.md) needs POB_URL, a credential, POB_USER_MATCH, POB_CUSTOMER_MATCH, POB_STATUS_KINDS and
# POB_CASE_TYPES. `POB_ADAPTER=fixture` serves the made-up errands in cases.mjs instead, for development only, and is
# refused beside a POB address or credential.
services:
  pob:
    build: .
    environment:
      CLEW_CONNECTOR_SECRET: ${POB_SECRET:?set POB_SECRET to a shared secret of 16+ characters}
      CLEW_URL: ${CLEW_URL:?set CLEW_URL to Clew's base URL, https outside local development}
      POB_IDP_ISSUER: ${POB_IDP_ISSUER:?set POB_IDP_ISSUER to the identity provider's issuer}
      POB_IDP_JWKS_URL: ${POB_IDP_JWKS_URL:?set POB_IDP_JWKS_URL to where the identity provider's keys are}
      POB_INSECURE_HTTP_HOSTS: ${POB_INSECURE_HTTP_HOSTS:-}
      POB_ADAPTER: ${POB_ADAPTER:?set POB_ADAPTER to api (with POB_URL and a credential), or to fixture for made-up development data}
      POB_AUDIENCE: ${POB_AUDIENCE:-}
      POB_ACCOUNT_CLAIM: ${POB_ACCOUNT_CLAIM:-}
      POB_SOURCE_LABEL: ${POB_SOURCE_LABEL:-}
      POB_STATUS_KINDS: ${POB_STATUS_KINDS:-}
      POB_CASE_TYPES: ${POB_CASE_TYPES:-}
      POB_PROBLEM_MEMO: ${POB_PROBLEM_MEMO:-}
      POB_CASE_LINK: ${POB_CASE_LINK:-}
      POB_URL: ${POB_URL:-}
      POB_USER: ${POB_USER:-}
      POB_PASSWORD: ${POB_PASSWORD:-}
      POB_AUTHORIZATION: ${POB_AUTHORIZATION:-}
      POB_USER_MATCH: ${POB_USER_MATCH:-}
      POB_CUSTOMER_MATCH: ${POB_CUSTOMER_MATCH:-}
      POB_FIELDS: ${POB_FIELDS:-}
      POB_STATUS_LABELS: ${POB_STATUS_LABELS:-}
      POB_TIMEZONE: ${POB_TIMEZONE:-}
      POB_LIST_LIMIT: ${POB_LIST_LIMIT:-}
      POB_START_CHECK: ${POB_START_CHECK:-}
    ports:
      - "127.0.0.1:4055:4055"
