# The phone book connector next to the devcontainer. An administrator registers it in Clew (Administration › Anslutna
# system, or `bun scripts/connector-add.ts`), so nothing on Clew's container names it (D23).
#
#   TELEFONBOK_SECRET=<16+ characters> docker compose -f connectors/telefonbok/compose.yaml up telefonbok
# and register it from inside the app container with the same secret:
#   docker exec -w /workspace clew-app-1 bun scripts/connector-add.ts telefonbok http://host.docker.internal:4020 --secret <the secret> --enable
#
# Without TELEFONBOK_ADAPTER the connector serves the made-up organisation in directory.mjs. Against the real phone book:
#   TELEFONBOK_ADAPTER=http TELEFONBOK_URL=https://… TELEFONBOK_API_KEY=… (from the secrets store, never from this file)
services:
  telefonbok:
    build: .
    environment:
      CLEW_CONNECTOR_SECRET: ${TELEFONBOK_SECRET:?set TELEFONBOK_SECRET to a shared secret of 16+ characters}
      TELEFONBOK_ADAPTER: ${TELEFONBOK_ADAPTER:-fixture}
      TELEFONBOK_URL: ${TELEFONBOK_URL:-}
      TELEFONBOK_API_KEY: ${TELEFONBOK_API_KEY:-}
      TELEFONBOK_UNIT_MAP: ${TELEFONBOK_UNIT_MAP:-}
    ports:
      - "127.0.0.1:4020:4020"
