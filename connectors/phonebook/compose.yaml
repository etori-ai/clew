# The phone book connector on its own, next to a Clew and a phone book it can reach. An administrator registers it in
# Clew (Administration › Anslutna system, or `bun scripts/connector-add.ts`), so nothing on Clew's container names it
# (D23). In development it runs inside the app container instead (docs/guides/example-custom-directory.md).
#
#   PHONEBOOK_SECRET=<16+ characters> CLEW_URL=https://clew.example PHONEBOOK_ADAPTER=http PHONEBOOK_URL=https://… \
#   PHONEBOOK_API_KEY=… docker compose -f connectors/phonebook/compose.yaml up phonebook
#
# The secret and the API key come from the secrets store, never from this file.
# PHONEBOOK_ADAPTER has no default: the connector does not start without it. `PHONEBOOK_ADAPTER=fixture` serves the
# made-up organisation in directory.mjs instead, for development only, and is refused beside PHONEBOOK_URL or
# PHONEBOOK_API_KEY.
services:
  phonebook:
    build: .
    environment:
      CLEW_CONNECTOR_SECRET: ${PHONEBOOK_SECRET:?set PHONEBOOK_SECRET to a shared secret of 16+ characters}
      CLEW_URL: ${CLEW_URL:?set CLEW_URL to Clew's base URL, https outside local development}
      PHONEBOOK_ADAPTER: ${PHONEBOOK_ADAPTER:?set PHONEBOOK_ADAPTER to http (with PHONEBOOK_URL and PHONEBOOK_API_KEY), or to fixture for made-up development data}
      PHONEBOOK_URL: ${PHONEBOOK_URL:-}
      PHONEBOOK_ALLOW_HTTP: ${PHONEBOOK_ALLOW_HTTP:-}
      PHONEBOOK_API_KEY: ${PHONEBOOK_API_KEY:-}
      PHONEBOOK_UNIT_MAP: ${PHONEBOOK_UNIT_MAP:-}
    ports:
      - "127.0.0.1:4020:4020"
