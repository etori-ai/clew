# The absence statistics connector next to the devcontainer. An administrator registers it in Clew (Administration ›
# Anslutna system, or `bun scripts/connector-add.ts`), so nothing on Clew's container names it (D23).
#
#   ABSENCE_SECRET=<16+ characters> docker compose -f connectors/absence/compose.yaml up absence
# and register it from inside the app container with the same secret:
#   docker exec -w /workspace clew-app-1 bun scripts/connector-add.ts absence http://host.docker.internal:4048 --secret <the secret> --enable
#
# Without ABSENCE_ADAPTER the connector serves the made-up statistics in statistics.mjs. Against Qlik (D82):
#   ABSENCE_ADAPTER=qlik QLIK_URL=wss://… QLIK_APP_ID=… QLIK_TOKEN=… (from the secrets store, never from this file)
#   QLIK_CUBE='{"unit":"…","period":"…","measures":{"total":"…","headcount":"…"}}' ABSENCE_UNIT_MAP='{"<unit id>":["…"]}'
services:
  absence:
    build: .
    environment:
      CLEW_CONNECTOR_SECRET: ${ABSENCE_SECRET:?set ABSENCE_SECRET to a shared secret of 16+ characters}
      CLEW_URL: ${CLEW_URL:?set CLEW_URL to Clew's base URL, https outside local development}
      ABSENCE_ADAPTER: ${ABSENCE_ADAPTER:-fixture}
      ABSENCE_UNIT_MAP: ${ABSENCE_UNIT_MAP:-}
      ABSENCE_MIN_GROUP: ${ABSENCE_MIN_GROUP:-}
      ABSENCE_WARN_ABOVE: ${ABSENCE_WARN_ABOVE:-}
      ABSENCE_CACHE_SECONDS: ${ABSENCE_CACHE_SECONDS:-}
      QLIK_URL: ${QLIK_URL:-}
      QLIK_APP_ID: ${QLIK_APP_ID:-}
      QLIK_TOKEN: ${QLIK_TOKEN:-}
      QLIK_CUBE: ${QLIK_CUBE:-}
      QLIK_RATES_AS: ${QLIK_RATES_AS:-}
    ports:
      - "127.0.0.1:4048:4048"
