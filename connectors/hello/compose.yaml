# A Clew stack with one third-party connector. The connector is its own image; Clew learns about it from two
# environment variables and nothing in Clew's image changes. Replace `hello` with your connector.
#
#   CLEW_CONNECTORS          "<id>=<url>" per connector, comma separated; the id must equal the manifest id
#   CLEW_CONNECTOR_SECRET_<ID>  the shared secret for that connector (id upper-cased, '-' as '_')
#
# Clew's own image is not published yet (HANDOVER next steps); until then run the connector next to the devcontainer:
#   docker compose -f connectors/hello/compose.yaml up hello
# and set CLEW_CONNECTORS=hello=http://host.docker.internal:4010 (or the compose network name) in apps/server/.env.local.
services:
  hello:
    build: .
    environment:
      CLEW_CONNECTOR_SECRET: ${HELLO_SECRET:?set HELLO_SECRET to a shared secret of 16+ characters}
      CLEW_URL: http://clew:3000
    ports:
      - "127.0.0.1:4010:4010"
