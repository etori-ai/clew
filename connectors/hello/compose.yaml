# A Clew stack with one connector. The connector is its own image; an administrator registers it in Clew
# (Administration › Anslutna system, or `bun scripts/connector-add.ts` until that page exists), so nothing on
# Clew's container names it (D23). Replace `hello` with your connector.
#
#   HELLO_SECRET=<16+ characters> CLEW_URL=https://clew.example docker compose -f connectors/hello/compose.yaml up hello
#
# CLEW_URL is https: the connector fetches Clew's public keys from it, and over plain http only from a host of the
# development stack; it does not start without one. Clew's own image is not published yet; until then, in development,
# run the connector inside the app container instead, where CLEW_URL=http://127.0.0.1:3000 (README.md, "Run locally").
services:
  hello:
    build: .
    environment:
      CLEW_CONNECTOR_SECRET: ${HELLO_SECRET:?set HELLO_SECRET to a shared secret of 16+ characters}
      CLEW_URL: ${CLEW_URL:?set CLEW_URL to Clew's base URL, https outside local development}
    ports:
      - "127.0.0.1:4010:4010"
  # clew:
  #   image: <clew image>
  #   environment:
  #     HOST: 0.0.0.0                      # connectors reach /api/connectors/call over the compose network
  #     DATABASE_URL: postgres://clew:...@postgres:5432/clew
  #     MASTER_KEY: ...                    # seals connector secrets at rest
