name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'llms.txt'
      - 'docs/**'
      - 'scripts/docs*.ts'
      - 'scripts/connector-protocol-schema.ts'
      - 'packages/contracts/**'
      - 'packages/connectors/**'
      - 'connectors/**'
      - 'apps/server/src/connectors/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'llms.txt'
      - 'docs/**'
      - 'scripts/docs*.ts'
      - 'scripts/connector-protocol-schema.ts'
      - 'packages/contracts/**'
      - 'packages/connectors/**'
      - 'connectors/**'
      - 'apps/server/src/connectors/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Generated references and executable examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify documentation without the service stack
        run: sh scripts/compose.sh run --rm --no-deps --build app sh -c "bun install --frozen-lockfile && bun run docs:check"
