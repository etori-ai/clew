name: WCAG

# Manual until the run-up to a release (D59). Uncomment push and pull_request to make it automatic again.
on:
  # push:
  #   branches: [main]
  #   paths-ignore: ['docs/**', '**/*.md']
  # pull_request:
  #   paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a11y:
    name: WCAG 2.2 AA suite (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The dev image's Bun, pinned by digest, fills the node_modules volume that scripts/a11y.sh mounts in the
      # Playwright image, as it does on a workstation.
      - name: Install dependencies
        id: dependencies
        run: sh scripts/compose.sh run --rm --no-deps --build app bun install --frozen-lockfile
      - name: Run the suite
        run: sh scripts/a11y.sh --shard=${{ matrix.shard }}/3
      - name: Check the Sundsvall profile
        if: ${{ !cancelled() && matrix.shard == 1 && steps.dependencies.outcome == 'success' }}
        run: CLEW_A11Y_BRAND_PROFILE=sundsvall sh scripts/a11y.sh branding.spec.ts
      - name: Check the custom profile
        if: ${{ !cancelled() && matrix.shard == 1 && steps.dependencies.outcome == 'success' }}
        run: CLEW_A11Y_BRAND_PROFILE=custom sh scripts/a11y.sh branding.spec.ts
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
