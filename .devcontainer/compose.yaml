name: clew
# What every fixture connector service shares (the six are under services, after the stack). The workspace is mounted
# read-only: a code change is `restart <service>`, no image build. CLEW_URL names the app container, where the BFF must
# listen on 0.0.0.0 (HOST below) so the connectors can fetch its public keys and call back.
x-fixture: &fixture
  image: node:26.13.0-bookworm-slim
  init: true
  command: node server.mjs
  environment: &fixture-environment
    CLEW_URL: http://app:3000
    CLEW_CONNECTOR_SECRET: ${CLEW_DEV_CONNECTOR_SECRET:-clew-dev-only-transport-key}
    FIXTURE_DB: /state/fixture.sqlite
services:
  app:
    image: clew-dev:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace
      - node_modules:/workspace/node_modules
      - bun_cache:/root/.bun/install/cache
    ports:
      # Only the Vite dev server is published, on loopback. It proxies /api to the BFF inside the container.
      - "127.0.0.1:3020:5173"
    extra_hosts:
      - "keycloak.orb.local:host-gateway"
    environment:
      DATABASE_URL: postgres://clew:clew-local@postgres:5432/clew
      CALENDAR_URL: http://calendar
      CLEW_POC: "true"
      # The BFF listens on every interface so the fixture connectors can reach it; the published port is still loopback only.
      HOST: 0.0.0.0
      CLEW_DEV_CONNECTOR_SECRET: ${CLEW_DEV_CONNECTOR_SECRET:-clew-dev-only-transport-key}
      # Telemetry (D91): traces and metrics to the otel service below; unset in production until an operator chooses a backend.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      LOG_FORMAT: pretty
    depends_on:
      postgres:
        condition: service_healthy
  # The WCAG 2.2 AA suite (tests/a11y, scripts/a11y.sh). Playwright is Apache-2.0, axe-core MPL-2.0.
  # The API is mocked in the browser, so this service needs nothing else from the stack.
  a11y:
    image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    profiles: [a11y]
    init: true
    working_dir: /workspace
    environment:
      CI: "true"
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace
      - node_modules:/workspace/node_modules
  # PostgreSQL 18 keeps its data under /var/lib/postgresql/<major>, so the volume is mounted one level up and has a name
  # of its own: the PostgreSQL 17 volume (postgres_data) is left as it was. `sh scripts/postgres-upgrade.sh` carries an
  # existing development database across.
  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_USER: clew
      POSTGRES_PASSWORD: clew-local
      POSTGRES_DB: clew
    volumes:
      - postgres_18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clew -d clew"]
      interval: 3s
      timeout: 3s
      retries: 20
  # Traces, metrics and a place to look at them (D91): Grafana, Tempo, Loki and Prometheus in one container, AGPL-3.0 as a
  # separate process. The app exports OTLP to otel:4318; Grafana is anonymous and development only.
  otel:
    image: grafana/otel-lgtm:0.40.0@sha256:72e05804790e6e0d8c0b70a6d5ff1f721ef7b203463374631e99aa3429bd0cf6
    ports:
      - "127.0.0.1:3023:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
  calendar:
    image: clew-calendar:local
    build:
      context: ./calendar
    profiles: ["calendar"]
    init: true
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: clew_calendar
      POSTGRES_USER: clew_calendar
      POSTGRES_PASSWORD: calendar-local-only
      NEXTCLOUD_ADMIN_USER: calendar-admin
      NEXTCLOUD_ADMIN_PASSWORD: calendar-admin-local-only
      NEXTCLOUD_TRUSTED_DOMAINS: "calendar localhost:3021 127.0.0.1:3021"
      PHP_MEMORY_LIMIT: 256M
      PHP_UPLOAD_LIMIT: 8M
      CLEW_POC: "true"
    volumes:
      - calendar_data:/var/www/html
      - ${CLEW_HOST_WORKSPACE:-..}/.devcontainer/calendar:/opt/clew-calendar:ro
    ports:
      - "127.0.0.1:3021:80"
    # user_oidc fetches the realm's discovery document and keys from the issuer in the tokens it validates (D101).
    extra_hosts:
      - "keycloak.orb.local:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      calendar-mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/status.php"]
      interval: 5s
      timeout: 3s
      retries: 60
  # The local fake of Microsoft Graph (D69): scripts/fake-graph.ts over the dev image. It needs no account or network and
  # runs in the base stack beside the fixture connectors: Mikael's calendar is Microsoft 365 over it (a mixed estate, D11),
  # CALENDAR_ADAPTER=microsoft365 on the BFF binds everyone to it. It seeds its own meetings and rooms as it starts, and
  # state lives in memory, so `restart graph` is a fresh seed from today. Published on loopback for a look with curl.
  graph:
    image: clew-dev:local
    init: true
    working_dir: /workspace
    command: bun scripts/fake-graph.ts
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      CLEW_POC: "true"
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace:ro
      - node_modules:/workspace/node_modules
    ports:
      - "127.0.0.1:4047:4010"
    healthcheck:
      test: ["CMD", "bun", "--eval", "process.exit((await fetch('http://localhost:4010/health')).ok ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 40
  calendar-mail:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    profiles: ["calendar"]
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /tmp/mailpit.db
    tmpfs:
      - /tmp:size=16m
    ports:
      - "127.0.0.1:3022:8025"
  # The fixture connectors (D61): six generic systems as independent services behind the connector protocol, run from the
  # workspace with Node's image (MIT), each with its records in SQLite on a volume of its own. They are registered in Clew
  # by `bun run dev:connectors` like a vendor's connector; nothing in Clew's code names them. `bun run fixtures:reset` seeds
  # them again from today. FIXTURE_FAULT on one of them (unavailable, slow, unauthorized, conflict, crash-after-commit)
  # shows what Clew does when a source misbehaves. Published on loopback so `connector-check` reaches them from the host.
  hr:
    <<: *fixture
    working_dir: /workspace/connectors/hr
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace:ro
      - hr_state:/state
    environment:
      <<: *fixture-environment
      FIXTURE_FEED_KEY: ${CLEW_DEV_FEED_KEY:-clew-dev-only-feed-key}
    ports:
      - "127.0.0.1:4040:4040"
  finance:
    <<: *fixture
    working_dir: /workspace/connectors/finance
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace:ro
      - finance_state:/state
    ports:
      - "127.0.0.1:4041:4041"
  incidents:
    <<: *fixture
    working_dir: /workspace/connectors/incidents
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace:ro
      - incidents_state:/state
    ports:
      - "127.0.0.1:4042:4042"
  communication:
    <<: *fixture
    working_dir: /workspace/connectors/communication
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace:ro
      - communication_state:/state
    ports:
      - "127.0.0.1:4043:4043"
  timesheet:
    <<: *fixture
    working_dir: /workspace/connectors/timesheet
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace:ro
      - timesheet_state:/state
    ports:
      - "127.0.0.1:4044:4044"
  # 4046, not 4045: the fetch standard lists 4045 among the ports a client refuses, and Node's fetch follows it.
  payroll:
    <<: *fixture
    working_dir: /workspace/connectors/payroll
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace:ro
    environment:
      <<: *fixture-environment
      HR_FEED_URL: http://hr:4040/fixture/absences
      FIXTURE_FEED_KEY: ${CLEW_DEV_FEED_KEY:-clew-dev-only-feed-key}
    depends_on:
      hr:
        condition: service_started
    ports:
      - "127.0.0.1:4046:4046"
  # The intranet (D88): the connector that gives Clew its shared header, standing in for the content system an
  # installation lists its sections from. No state of its own. 4049: 4048 is the Qlik connector's.
  intranet:
    <<: *fixture
    working_dir: /workspace/connectors/intranet
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace:ro
    ports:
      - "127.0.0.1:4049:4049"
  # The appraisal system (D96 items 8 and 9): a generic third-party system answering the talks profile, so an
  # administrator can switch from Clew's built-in module to it. Stateless; registered as a draft, not enabled.
  # 4051: 4050 is the SupportManagement connector's.
  appraisals:
    <<: *fixture
    working_dir: /workspace/connectors/appraisals
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace:ro
    ports:
      - "127.0.0.1:4051:4051"
  # Nextcloud's Approval app (D101), the first source not written for Clew. The connector calls Nextcloud as the person,
  # with the token Clew exchanges for the audience `nextcloud`, and holds no credential of its own; so it is in the
  # calendar profile, beside the Nextcloud it needs. Stateless. Not registered by `dev:connectors`: the command is in
  # connectors/nextcloud-approval/README.md. Links open the file on the host's published Nextcloud. 4052: 4051 is taken.
  nextcloud-approval:
    <<: *fixture
    profiles: ["calendar"]
    working_dir: /workspace/connectors/nextcloud-approval
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace:ro
    environment:
      <<: *fixture-environment
      NEXTCLOUD_ADAPTER: nextcloud
      NEXTCLOUD_URL: http://calendar
      NEXTCLOUD_ALLOW_HTTP: "true"
      NEXTCLOUD_PUBLIC_URL: http://localhost:3021
    ports:
      - "127.0.0.1:4052:4052"

volumes:
  node_modules:
  bun_cache:
  postgres_18_data:
  calendar_data:
  hr_state:
  finance_state:
  incidents_state:
  communication_state:
  timesheet_state:
