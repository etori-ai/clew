name: clew
services:
  app:
    image: clew-dev:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace
      - node_modules:/workspace/node_modules
      - bun_cache:/root/.bun/install/cache
    ports:
      # The Vite dev server, on loopback. It proxies /api to the BFF inside the container.
      - "127.0.0.1:3020:5173"
      # The `keycloak` profile's Keycloak, which shares this container's network (D62). Nothing answers without it.
      - "127.0.0.1:3024:3024"
    # The dev Keycloak by the name the browser uses too (D60, D62): the shared container on the macOS host as
    # keycloak.orb.local, or the `keycloak` profile in this container's own network as keycloak.localhost.
    extra_hosts:
      - "keycloak.orb.local:host-gateway"
      - "keycloak.localhost:127.0.0.1"
    environment:
      DATABASE_URL: postgres://clew:clew-local@postgres:5432/clew
      CALENDAR_URL: http://calendar
      CLEW_POC: "true"
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
  # The development identity provider, opt in (D62): `sh scripts/compose.sh --profile keycloak up -d --wait`.
  # Keycloak (Apache-2.0) runs in the app container's network, so http://keycloak.localhost:3024 is loopback for the
  # browser on the host (the app service publishes the port) and for Node, Bun and curl in the container alike.
  # Local-only admin account, like Postgres and Nextcloud here; realm, client and people come from `bun run auth:setup`.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
    profiles: [keycloak]
    network_mode: "service:app"
    command: ["start-dev", "--http-port=3024"]
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak-admin-local-only
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      app:
        condition: service_started
  # The WCAG 2.2 AA suite (tests/a11y, scripts/a11y.sh). Playwright is Apache-2.0, axe-core MPL-2.0.
  # The API is mocked in the browser, so this service needs nothing else from the stack.
  a11y:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    profiles: [a11y]
    init: true
    working_dir: /workspace
    environment:
      CI: "true"
    volumes:
      - ${CLEW_HOST_WORKSPACE:-..}:/workspace
      - node_modules:/workspace/node_modules
  postgres:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: clew
      POSTGRES_PASSWORD: clew-local
      POSTGRES_DB: clew
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clew -d clew"]
      interval: 3s
      timeout: 3s
      retries: 20
  # Temporal (MIT) runs approved executions, timers, bounded follow-up and scheduled jobs (D17/D45/D47).
  # auto-setup creates its two databases in the shared Postgres on first start. Dev only; production runs temporalio/server.
  temporal:
    image: temporalio/auto-setup:1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: clew
      POSTGRES_PWD: clew-local
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
  temporal-ui:
    image: temporalio/ui:2.58.0@sha256:d36185e811d0ce1720b8d3ca4d9ac4dac504b67181e9b5e3d3ca72b2294f3590
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3023
    ports:
      - "127.0.0.1:3023:8080"
    depends_on:
      temporal:
        condition: service_started
  calendar:
    image: clew-calendar:local
    build:
      context: ./calendar
    profiles: ["calendar"]
    init: true
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: clew_calendar
      POSTGRES_USER: clew_calendar
      POSTGRES_PASSWORD: calendar-local-only
      NEXTCLOUD_ADMIN_USER: calendar-admin
      NEXTCLOUD_ADMIN_PASSWORD: calendar-admin-local-only
      NEXTCLOUD_TRUSTED_DOMAINS: "calendar localhost:3021 127.0.0.1:3021"
      PHP_MEMORY_LIMIT: 256M
      PHP_UPLOAD_LIMIT: 8M
      CLEW_POC: "true"
    volumes:
      - calendar_data:/var/www/html
      - ${CLEW_HOST_WORKSPACE:-..}/.devcontainer/calendar:/opt/clew-calendar:ro
    ports:
      - "127.0.0.1:3021:80"
    depends_on:
      postgres:
        condition: service_healthy
      calendar-mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/status.php"]
      interval: 5s
      timeout: 3s
      retries: 60
  calendar-mail:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    profiles: ["calendar"]
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /tmp/mailpit.db
    tmpfs:
      - /tmp:size=16m
    ports:
      - "127.0.0.1:3022:8025"
volumes:
  node_modules:
  bun_cache:
  postgres_data:
  calendar_data:
  keycloak_data:
