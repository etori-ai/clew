# Small prefork pool for a single-developer provider. At least two independent workers are
# required so concurrent booking tests exercise the source; a few more keep the app's parallel
# DAV reads from queueing behind each other. Keep-alive is short because idle connections from
# the application otherwise occupy a worker for the full timeout and stall the next request.
StartServers 2
MinSpareServers 1
MaxSpareServers 3
ServerLimit 6
MaxRequestWorkers 6
MaxConnectionsPerChild 200
KeepAliveTimeout 1
