<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medarbetarpuls · veckopuls</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #183d49;
        background: #f2f8fa;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      p {
        line-height: 1.5;
        margin: 0 0 16px;
      }
      h1 {
        font-size: 22px;
        line-height: 1.3;
        margin: 8px 0 20px;
      }
      .brand {
        font-size: 14px;
        font-weight: 650;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
      }
      legend {
        font-size: 18px;
        line-height: 1.5;
        margin-bottom: 18px;
      }
      .scores {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 12px;
        background: white;
        border: 1px solid #60838e;
        border-radius: 8px;
        cursor: pointer;
        min-width: 44px;
        min-height: 44px;
      }
      label:has(input:checked) {
        background: #d9eff5;
        outline: 2px solid #185c70;
      }
      label:focus-within {
        outline: 3px solid #185c70;
        outline-offset: 3px;
      }
      input {
        accent-color: #185c70;
      }
      .scale {
        margin: 12px 0 20px;
        font-size: 14px;
      }
      button {
        font: inherit;
        font-weight: 650;
        background: #185c70;
        color: white;
        border: 0;
        border-radius: 8px;
        min-height: 44px;
        padding: 12px 20px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button:focus-visible {
        outline: 3px solid #185c70;
        outline-offset: 3px;
      }
      #status {
        margin-top: 16px;
      }
      @media (max-width: 350px) {
        body {
          padding: 16px;
        }
        .scores {
          gap: 8px;
        }
        label {
          padding: 10px 8px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Medarbetarpuls">
      <p class="brand">Medarbetarpuls</p>
      <h1 id="title">Din arbetsvecka</h1>
      <form id="poll" hidden>
        <fieldset>
          <legend id="question">Hur har du haft det på jobbet den här veckan?</legend>
          <div class="scores">
            <label><input type="radio" name="score" value="1" aria-label="1, mycket dåligt" required />1</label>
            <label><input type="radio" name="score" value="2" aria-label="2, dåligt" />2</label>
            <label><input type="radio" name="score" value="3" aria-label="3, varken bra eller dåligt" />3</label>
            <label><input type="radio" name="score" value="4" aria-label="4, bra" />4</label>
            <label><input type="radio" name="score" value="5" aria-label="5, mycket bra" />5</label>
          </div>
        </fieldset>
        <p class="scale">1 = mycket dåligt. 5 = mycket bra.</p>
        <p>Det här är en testenkät. Använd bara påhittade svar.</p>
        <button id="send" type="submit">Skicka svar</button>
      </form>
      <p id="status" role="status">Hämtar enkäten …</p>
    </main>
    <script>
      let poll;
      let nextId = 1;
      const pending = new Map();
      const send = message => parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
      const request = (method, params) =>
        new Promise((resolve, reject) => {
          const id = nextId++;
          pending.set(id, { resolve, reject });
          send({ id, method, params });
        });
      addEventListener('message', event => {
        if (event.source !== parent || event.data?.jsonrpc !== '2.0') return;
        const message = event.data;
        if (pending.has(message.id)) {
          const promise = pending.get(message.id);
          pending.delete(message.id);
          message.error ? promise.reject(new Error(message.error.message)) : promise.resolve(message.result);
        }
        if (message.method === 'ui/notifications/tool-result' && message.params?._meta?.poll) {
          poll = message.params._meta.poll;
          document.querySelector('#title').textContent = poll.title;
          document.querySelector('#question').textContent = poll.question;
          document.querySelector('#poll').hidden = poll.answered;
          document.querySelector('#status').textContent = poll.answered ? 'Du har redan besvarat den här enkäten.' : '';
        }
      });
      document.querySelector('#poll').addEventListener('submit', async event => {
        event.preventDefault();
        const button = document.querySelector('#send');
        button.disabled = true;
        document.querySelector('#status').textContent = 'Bekräfta i chatten för att skicka.';
        try {
          const result = await request('tools/call', {
            name: 'submit_poll',
            arguments: { pollId: poll.id, score: Number(new FormData(event.target).get('score')) },
          });
          if (result.isError) throw new Error(result.content[0].text);
          document.querySelector('#poll').hidden = true;
          document.querySelector('#status').textContent = result.content[0].text;
        } catch (error) {
          document.querySelector('#status').textContent = error.message;
          button.disabled = false;
        }
      });
      request('ui/initialize', {
        appInfo: { name: 'employee-pulse', version: '0.1.0' },
        appCapabilities: {},
        protocolVersion: '2026-01-26',
      }).then(() => send({ method: 'ui/notifications/initialized' }));
    </script>
  </body>
</html>
