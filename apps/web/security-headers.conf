# The headers the web app's pages and files are served with (D145). The web image's nginx includes this file in every
# location that serves the built files; an installation that serves them from a proxy of its own includes the same file
# there (docs/guides/scim-sign-in-and-hosting.md). The accessibility suite serves its build under these headers and fails
# a test on any violation of the policy (tests/a11y/security-headers.ts), and tests/unit/web-security-headers.test.ts
# holds what the policy must keep. Widen a source only together with the decision that allows it.
#
# The policy: scripts, connections, workers, frames and fonts from Clew's own origin only, and no plugins, no <base> and
# no form that posts elsewhere. Styles may be inline, because the Word preview draws into a frame that inherits this
# policy and writes its own <style> (packages/ui/src/document.tsx). Images may also be data: and blob: (a document's
# preview) and any https address (the shared header's logo is the intranet's own, D88). No page may frame Clew.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# The framing rule again for a browser that reads no frame-ancestors.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# An address in Clew names a person, a work item or a question: none of it goes to another site with a link.
add_header Referrer-Policy "same-origin" always;
# A year of https only for this host. Whether every subdomain is held to it is the domain owner's decision, not Clew's.
add_header Strict-Transport-Security "max-age=31536000" always;
